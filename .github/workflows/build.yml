name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project DaYan.xcodeproj \
            -scheme DaYan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 打包成 ipa
        run: |
          set -e
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DaYan.app Payload/
          zip -qry DaYan.ipa Payload
          ls -lh DaYan.ipa

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: DaYan-ipa
          path: DaYan.ipa

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
